// ── INFRA: IndexedDB ──────────────────────────────────────────────────────
let _db = null;
function openDB() {
  if (_db) return Promise.resolve(_db);
  return new Promise((res, rej) => {
    const req = indexedDB.open('linguas_v1', 1);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('cards')) {
        const cs = db.createObjectStore('cards', { keyPath: 'item_id' });
        cs.createIndex('by_due', 'due');
        cs.createIndex('by_lang_due', ['lang','due']);
      }
      if (!db.objectStoreNames.contains('reviews')) {
        const rs = db.createObjectStore('reviews', { autoIncrement: true, keyPath: 'id' });
        rs.createIndex('by_timestamp', 'timestamp');
        rs.createIndex('by_item_id', 'item_id');
      }
      if (!db.objectStoreNames.contains('settings')) {
        db.createObjectStore('settings', { keyPath: 'key' });
      }
    };
    req.onsuccess = e => { _db = e.target.result; res(_db); };
    req.onerror = () => rej(req.error);
  });
}

const idbReq = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });

function makeCardRepo(db) {
  const S = 'cards';
  const s = (m='readonly') => db.transaction(S,m).objectStore(S);
  return {
    get: id => idbReq(s().get(id)),
    put: c => idbReq(s('readwrite').put(c)),
    putMany: cards => new Promise((res, rej) => {
      if (!cards.length) { res(); return; }
      const tx = db.transaction(S, 'readwrite');
      for (const c of cards) tx.objectStore(S).put(c);
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
    }),
    getAll: () => idbReq(s().getAll()),
    getDue: async (lang, nowMs) => {
      const all = await idbReq(s().index('by_lang_due').getAll(IDBKeyRange.bound([lang,0],[lang,nowMs])));
      return all.filter(c => c.state !== 0);
    },
    getNew: async lang => {
      const all = await idbReq(s().index('by_lang_due').getAll(IDBKeyRange.bound([lang,0],[lang,Infinity])));
      return all.filter(c => c.state === 0);
    },
    getAllByLang: lang => idbReq(s().index('by_lang_due').getAll(IDBKeyRange.bound([lang,0],[lang,Infinity]))),
    clear: () => idbReq(s('readwrite').clear()),
  };
}

function makeReviewRepo(db) {
  const S = 'reviews';
  const s = (m='readonly') => db.transaction(S,m).objectStore(S);
  return {
    add: r => idbReq(s('readwrite').add(r)),
    delete: id => idbReq(s('readwrite').delete(id)),
    getAll: () => idbReq(s().getAll()),
    getByTimestampRange: (from, to) => idbReq(s().index('by_timestamp').getAll(IDBKeyRange.bound(from,to))),
    clear: () => idbReq(s('readwrite').clear()),
  };
}

function makeSettingsRepo(db) {
  const S = 'settings';
  const s = (m='readonly') => db.transaction(S,m).objectStore(S);
  const cache = {};
  return {
    async load() {
      const all = await idbReq(s().getAll());
      for (const {key,value} of all) cache[key] = value;
    },
    get(key) { return key in cache ? cache[key] : SETTINGS_DEFAULTS[key]; },
    async set(key, value) { cache[key] = value; return idbReq(s('readwrite').put({key,value})); },
    getAll: () => idbReq(s().getAll()),
    clear: () => idbReq(s('readwrite').clear()),
  };
}

// ── INFRA: Corpus Loader ──────────────────────────────────────────────────
async function loadCorpus(url) {
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error('HTTP '+r.status);
    const d = await r.json();
    if (!d.concepts) throw new Error('bad schema');
    return d;
  } catch(e) {
    if (FEATURES.DEBUG_LOG) console.warn('Corpus fetch failed, using inline:', e.message);
    return CORPUS_INLINE;
  }
}

// ── INFRA: Export / Import ────────────────────────────────────────────────
async function exportState(repos) {
  const data = {
    version:'1.0', exported_at: new Date().toISOString(),
    settings: await repos.settings.getAll(),
    cards: await repos.cards.getAll(),
    reviews: await repos.reviews.getAll(),
  };
  const blob = new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `state_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  await repos.settings.set('last_export_at', Date.now());
  showToast('✅ Estado exportado.', 'success');
}

async function importState(file, repos, onDone) {
  let data;
  try { data = JSON.parse(await file.text()); } catch { showToast('❌ JSON inválido.','error'); return; }
  if (!data.cards || !Array.isArray(data.cards)) { showToast('❌ Schema inválido.','error'); return; }
  if (!confirm('Isso substituirá TODOS os dados atuais. Continuar?')) return;
  try {
    await repos.cards.clear(); await repos.reviews.clear(); await repos.settings.clear();
    for (const c of data.cards) await repos.cards.put(c);
    for (const rv of data.reviews) { const {id:_,...r2} = rv; await repos.reviews.add(r2); }
    if (data.settings) for (const s of data.settings) await repos.settings.set(s.key, s.value);
    await repos.settings.load();
    showToast('✅ Importado. Recarregue para aplicar.','success',true);
    if (onDone) onDone();
  } catch(e) { showToast('❌ Erro: '+e.message,'error'); }
}

// ── DOMAIN: cardFactory ───────────────────────────────────────────────────
function cardFactory(conceptId, lang, targetIndex, now) {
  return {
    item_id: `${conceptId}_${lang}_${targetIndex}`,
    concept_id: conceptId, lang, target_index: targetIndex,
    due: now.getTime(), stability:0, difficulty:0, elapsed_days:0,
    scheduled_days:0, reps:0, lapses:0, state:0, last_review:null,
    created_at: now.getTime(), updated_at: now.getTime(),
  };
}

// ── DOMAIN: srsEngine (Strategy) ─────────────────────────────────────────
function makeSrsEngine(settings) {
  const _ec = {};
  function _eng(lang) {
    const ret = settings.get(`desired_retention.${lang}`);
    const k = `${lang}:${ret}`;
    if (!_ec[k]) _ec[k] = fsrs(generatorParameters({
      request_retention: ret, maximum_interval: 36500,
      enable_fuzz: true, enable_short_term: false,
    }));
    return _ec[k];
  }
  function _ts(c) {
    return {
      due: new Date(c.due), stability: c.stability, difficulty: c.difficulty,
      elapsed_days: c.elapsed_days, scheduled_days: c.scheduled_days,
      reps: c.reps, lapses: c.lapses, state: c.state,
      last_review: c.last_review ? new Date(c.last_review) : undefined,
    };
  }
  return {
    schedule(card, now, rating) {
      const minH = settings.get('min_interval_hours');
      const res = _eng(card.lang).next(_ts(card), now, rating);
      const u = {
        ...card,
        due: res.card.due.getTime(), stability: res.card.stability,
        difficulty: res.card.difficulty, elapsed_days: res.card.elapsed_days,
        scheduled_days: res.card.scheduled_days, reps: res.card.reps,
        lapses: res.card.lapses, state: res.card.state,
        last_review: now.getTime(), updated_at: Date.now(),
      };
      // CLAMP: min 24h
      if (u.scheduled_days < 1) { u.scheduled_days = 1; u.due = now.getTime() + minH*3600000; }
      return u;
    },
    previewIntervals(card, now) {
      const o = {};
      for (const r of [1,2,3,4]) {
        try { o[r] = Math.max(1, _eng(card.lang).next(_ts(card), now, r).card.scheduled_days); }
        catch { o[r] = 1; }
      }
      return o;
    }
  };
}

// ── DOMAIN: sessionBuilder (Builder) ─────────────────────────────────────
function groupByConceptLang(cards) {
  const m = new Map();
  for (const c of cards) {
    const k = `${c.concept_id}::${c.lang}`;
    if (!m.has(k)) m.set(k, {concept_id:c.concept_id, lang:c.lang, cards:[], minDue:c.due});
    const e = m.get(k); e.cards.push(c);
    if (c.due < e.minDue) e.minDue = c.due;
  }
  return [...m.values()];
}

function applyAntiInterference(queue, gap) {
  if (!gap || FEATURES.DISABLE_ANTI_INTERFERENCE) return queue;
  let g = gap;
  while (g > 0) {
    const result = [], deferred = [];
    for (const item of queue) {
      const conflict = result.slice(-g).some(x => x.concept_id===item.concept_id && x.lang!==item.lang);
      if (conflict) deferred.push(item); else result.push(item);
    }
    if (!deferred.length) return result;
    for (const d of deferred) {
      let placed = false;
      for (let i = g; i <= result.length; i++) {
        if (!result.slice(Math.max(0,i-g),i).some(x=>x.concept_id===d.concept_id&&x.lang!==d.lang)) {
          result.splice(i,0,d); placed=true; break;
        }
      }
      if (!placed) result.push(d);
    }
    const ok = !result.some((item,idx) =>
      result.slice(Math.max(0,idx-g),idx).some(x=>x.concept_id===item.concept_id&&x.lang!==item.lang)
    );
    if (ok) return result;
    g--;
    if (g > 0) console.warn(`anti_interference gap relaxado para ${g}`);
  }
  console.warn('anti_interference: gap=0, sem reordenamento');
  return queue;
}

async function buildSession(repos, settings, now) {
  const activeLangs = settings.get('active_languages');
  const cap = settings.get('daily_review_cap');
  const gap = settings.get('anti_interference_gap');
  let items = [];
  for (const lang of activeLangs) {
    const due = await repos.cards.getDue(lang, now.getTime());
    items.push(...groupByConceptLang(due));
  }
  items.sort((a,b) => a.minDue - b.minDue);
  if (items.length > cap) items = items.slice(0, cap);
  for (const lang of activeLangs) {
    const dailyNew = settings.get(`daily_new.${lang}`);
    const newGroups = groupByConceptLang(await repos.cards.getNew(lang)).slice(0, dailyNew);
    items.push(...newGroups);
  }
  return applyAntiInterference(items, gap);
}

// ── DOMAIN: statsAggregator ───────────────────────────────────────────────
async function calcStats(repos, settings, now) {
  const activeLangs = settings.get('active_languages');
  const mt = settings.get('mature_threshold_days');
  const stats = {};
  const since30 = now.getTime() - 30*86400000;
  const allReviews = await repos.reviews.getByTimestampRange(since30, now.getTime());
  for (const lang of activeLangs) {
    const cards = await repos.cards.getAllByLang(lang);
    const due = cards.filter(c => c.state!==0 && c.due<=now.getTime()).length;
    const mature = cards.filter(c => c.scheduled_days > mt).length;
    const lr = allReviews.filter(r => r.item_id.split('_')[1]===lang);
    const lr7 = lr.filter(r => r.timestamp >= now.getTime()-7*86400000);
    const ret = arr => arr.length ? arr.filter(r=>r.rating>=3).length/arr.length : null;
    const avgT = arr => arr.length ? arr.reduce((s,r)=>s+r.duration_ms,0)/arr.length/1000 : null;
    const bins = Array(20).fill(0);
    for (const c of cards) if (c.state>0) bins[Math.min(19,Math.floor(c.difficulty/0.5))]++;
    stats[lang] = {due, mature, total:cards.length, ret7:ret(lr7), ret30:ret(lr), avgT7:avgT(lr7), bins};
  }
  return stats;
}

// ── DOMAIN: bootstrap (idempotent) ───────────────────────────────────────
async function bootstrap(corpus, repos, settings, onProgress) {
  const langs = settings.get('active_languages');
  const now = new Date();
  // One bulk read — check what already exists
  const existing = new Set((await repos.cards.getAll()).map(c => c.item_id));
  const toCreate = [];
  for (const concept of corpus.concepts) {
    for (const lang of langs) {
      const sent = concept.sentences[lang];
      if (!sent) continue;
      for (let ti = 0; ti < sent.targets.length; ti++) {
        const id = `${concept.id}_${lang}_${ti}`;
        if (!existing.has(id)) toCreate.push(cardFactory(concept.id, lang, ti, now));
      }
    }
  }
  // One bulk write — all cards in a single IDB transaction
  if (toCreate.length) await repos.cards.putMany(toCreate);
  if (onProgress) onProgress(toCreate.length);
  if (FEATURES.DEBUG_LOG) console.log(`Bootstrap: ${toCreate.length} novos cards`);
}

// ── UI: Tooltip ───────────────────────────────────────────────────────────
const _tt = document.getElementById('tooltip');
function showTooltip(span, concept, lang, tokIdx, isMature) {
  const sent = concept.sentences[lang];
  const tgt = sent.targets.find(t=>t.token_index===tokIdx);
  if (!tgt) return;
  const tPos = sent.targets.indexOf(tgt);
  const ptTgt = concept.sentences.pt.targets[tPos];
  const ptWord = ptTgt ? concept.sentences.pt.tokens[ptTgt.token_index].replace(/[.,!?:;]+$/,'') : '';
  const m = tgt.meta||{};
  const metaParts = [
    m.gender&&(m.gender==='f'?'fem.':'masc.'),
    m.number&&(m.number==='pl'?'pl.':'sg.'),
    m.tense, m.person,
  ].filter(Boolean);
  let html = `<div class="tt-lemma">${tgt.lemma}</div>`;
  if (ptWord) html += `<div class="tt-translation">🇧🇷 ${ptWord}</div>`;
  if (metaParts.length) html += `<div class="tt-meta">${metaParts.join(' · ')}</div>`;
  if (concept.false_friend && concept.false_friend_note)
    html += `<div class="tt-ff">⚠ ${concept.false_friend_note}</div>`;
  if (isMature) html = `<div class="tt-mature">🔒 Card maduro (forçado)</div>` + html;
  _tt.innerHTML = html;
  _tt.hidden = false;
  const r = span.getBoundingClientRect();
  const tw = _tt.offsetWidth||260, th = _tt.offsetHeight||100;
  let left = r.left+window.scrollX, top = r.bottom+window.scrollY+8;
  if (left+tw > window.innerWidth-12) left = window.innerWidth-tw-12;
  if (top+th > window.innerHeight+window.scrollY-12) top = r.top+window.scrollY-th-8;
  _tt.style.left = left+'px'; _tt.style.top = top+'px';
}
function hideTooltip() { _tt.hidden=true; _tt.innerHTML=''; }

// ── UI: renderSentence ────────────────────────────────────────────────────
function renderSentence(concept, lang, settings, repCard, matureThreshold) {
  const sent = concept.sentences[lang];
  const isPt = lang==='pt';
  const color = isPt ? null : settings.get(`highlight_color.${lang}`);
  const targetSet = new Set(sent.targets.map(t=>t.token_index));
  const isMature = !isPt && repCard && repCard.scheduled_days > matureThreshold;
  const p = document.createElement('p');
  p.className = 'sentence-text' + (isPt ? ' pt-anchor' : '');
  sent.tokens.forEach((tok, idx) => {
    const isLast = idx === sent.tokens.length-1;
    if (!targetSet.has(idx)) {
      p.appendChild(document.createTextNode(tok+(isLast?'':' ')));
      return;
    }
    const span = document.createElement('span');
    span.className = 'target-word';
    span.textContent = tok;
    if (!isPt) {
      span.style.textDecoration = 'underline';
      span.style.textDecorationColor = color;
      span.style.textDecorationThickness = '2px';
      span.tabIndex = 0;
      span.addEventListener('mouseenter', e => { if (!isMature||e.shiftKey) showTooltip(span,concept,lang,idx,isMature); });
      span.addEventListener('mouseleave', hideTooltip);
      span.addEventListener('click', () => { if (isMature) showTooltip(span,concept,lang,idx,isMature); });
      span.addEventListener('keydown', e => {
        if (e.key==='Enter'||e.key===' ') { e.preventDefault(); showTooltip(span,concept,lang,idx,isMature); }
        if (e.key==='Escape') hideTooltip();
      });
      if (concept.false_friend) {
        const ff = document.createElement('span');
        ff.className='ff-marker'; ff.textContent='⚠'; ff.title='Falso amigo';
        span.appendChild(ff);
      }
    }
    p.appendChild(span);
    if (!isLast) p.appendChild(document.createTextNode(' '));
  });
  return p;
}

// ── UI: Session ───────────────────────────────────────────────────────────
let _snap = null;
async function startSession(repos, corpus, settings, srsEngine) {
  showView('session');
  const view = document.getElementById('view-session');
  view.innerHTML='<div class="loading">Preparando…</div>';
  const now = FEATURES.MOCK_TODAY ? new Date(FEATURES.MOCK_TODAY) : new Date();
  const queue = await buildSession(repos, settings, now);
  if (!queue.length) {
    view.innerHTML=`<div class="session-end"><h2>🎉 Tudo em dia!</h2><p>Nenhum card devido.</p><button class="btn btn-primary" id="bbd">← Dashboard</button></div>`;
    document.getElementById('bbd')?.addEventListener('click',()=>{showView('dashboard');renderDashboard(repos,corpus,settings,srsEngine);});
    return;
  }
  const cMap = new Map(corpus.concepts.map(c=>[c.id,c]));
  const mt = settings.get('mature_threshold_days');
  const t0 = Date.now();
  let cardT = Date.now();
  let _kh = null;

  async function showCard(idx) {
    if (_kh) { document.removeEventListener('keydown',_kh); _kh=null; }
    if (idx >= queue.length) {
      const el=Math.round((Date.now()-t0)/1000);
      view.innerHTML=`<div class="session-end"><h2>✅ Sessão concluída!</h2><p>${queue.length} cards em ${Math.floor(el/60)}m ${el%60}s</p><button class="btn btn-primary" id="bbd2">← Dashboard</button></div>`;
      document.getElementById('bbd2')?.addEventListener('click',()=>{showView('dashboard');renderDashboard(repos,corpus,settings,srsEngine);});
      return;
    }
    cardT = Date.now(); _snap = null;
    const item = queue[idx];
    const concept = cMap.get(item.concept_id);
    if (!concept) { showCard(idx+1); return; }
    const lang = item.lang;
    const repCard = item.cards[0];
    const ivals = repCard ? srsEngine.previewIntervals(repCard, now) : {1:1,2:1,3:1,4:1};
    const pct = Math.round(idx/queue.length*100);
    const wrap = document.createElement('div');
    const prog = document.createElement('div');
    prog.className='session-progress';
    prog.innerHTML=`<span>${idx+1}/${queue.length}</span><div class="progress-bar-wrap"><div class="progress-bar" style="width:${pct}%"></div></div><span>${pct}%</span>`;
    wrap.appendChild(prog);
    const card = document.createElement('div');
    card.className='card';
    // PT anchor
    const ptRow=document.createElement('div'); ptRow.className='lang-row';
    const ptH=document.createElement('div'); ptH.className='lang-header';
    ptH.innerHTML='<span class="lang-tag lang-pt">PT</span>';
    ptRow.appendChild(ptH);
    ptRow.appendChild(renderSentence(concept,'pt',settings,null,mt));
    card.appendChild(ptRow);
    // Lang row
    const lRow=document.createElement('div'); lRow.className='lang-row';
    const lH=document.createElement('div'); lH.className='lang-header';
    lH.innerHTML=`<span class="lang-tag lang-${lang}">${lang.toUpperCase()}</span>`;
    lRow.appendChild(lH);
    lRow.appendChild(renderSentence(concept,lang,settings,repCard,mt));
    // Rating buttons
    const rRow=document.createElement('div'); rRow.className='rating-row';
    const rl=['Novamente','Difícil','Bom','Fácil'];
    const rc=['r-again','r-hard','r-good','r-easy'];
    for (let r=1;r<=4;r++) {
      const b=document.createElement('button');
      b.className=`rating-btn ${rc[r-1]}`;
      b.innerHTML=`<span class="btn-label">${rl[r-1]}</span><span class="btn-interval">${ivals[r]}d</span>`;
      b.addEventListener('click',()=>rateCard(r));
      rRow.appendChild(b);
    }
    lRow.appendChild(rRow); card.appendChild(lRow);
    // Undo row
    const uRow=document.createElement('div'); uRow.className='undo-row'; uRow.hidden=true;
    const uBtn=document.createElement('button'); uBtn.className='undo-btn'; uBtn.textContent='⟲ Desfazer';
    uBtn.addEventListener('click', undoLast); uRow.appendChild(uBtn); card.appendChild(uRow);
    // Meta
    const meta=document.createElement('div'); meta.className='meta-badge';
    meta.textContent=`${concept.cefr} · ${concept.theme.join(', ')}${concept.false_friend?' · ⚠ Falso amigo':''}`;
    if (FEATURES.SHOW_INTERNAL_IDS) meta.textContent+=` · ${item.concept_id}`;
    card.appendChild(meta);
    wrap.appendChild(card);
    view.innerHTML=''; view.appendChild(wrap);

    let rated=false;
    async function rateCard(rating) {
      if (rated) return; rated=true;
      const dur=Date.now()-cardT;
      const rn = FEATURES.MOCK_TODAY ? new Date(FEATURES.MOCK_TODAY) : new Date();
      _snap = {idx, cards: item.cards.map(c=>({...c})), reviewIds:[]};
      for (const c of item.cards) {
        const updated = srsEngine.schedule(c, rn, rating);
        await repos.cards.put(updated);
        const rid = await repos.reviews.add({item_id:c.item_id, rating, timestamp:rn.getTime(), duration_ms:dur, state_before:c.state, state_after:updated.state});
        _snap.reviewIds.push(rid);
        item.cards[item.cards.indexOf(c)] = updated;
      }
      uRow.hidden=false;
      setTimeout(()=>{ _snap=null; uRow.hidden=true; showCard(idx+1); }, 1000);
    }
    async function undoLast() {
      if (!_snap) return;
      const s=_snap; _snap=null;
      for (const c of s.cards) await repos.cards.put(c);
      for (const id of s.reviewIds) await repos.reviews.delete(id);
      showToast('↩ Desfeito.','');
      showCard(s.idx);
    }
    _kh = e => {
      if (rated) return;
      const m={'1':1,'2':2,'3':3,'4':4,'Enter':3};
      if (m[e.key]) { e.preventDefault(); rateCard(m[e.key]); }
    };
    document.addEventListener('keydown', _kh);
  }
  showCard(0);
}

// ── H1: Storage check ─────────────────────────────────────────────────────
async function checkStorage() {
  if (!navigator.storage) return;
  try {
    const est=await navigator.storage.estimate();
    const p=await navigator.storage.persist();
    if (!p||(est.quota&&est.quota<50*1024*1024)) {
      const b=document.getElementById('private-banner');
      b.className='warning-banner';
      b.textContent='⚠ Armazenamento pode não persistir. Use modo normal ou faça backups frequentes.';
    }
  } catch {}
}

// ── H3: Backup reminder ───────────────────────────────────────────────────
function checkBackupReminder(settings) {
  const days=settings.get('backup_reminder_days');
  if (!days) return;
  const last=settings.get('last_export_at');
  if (!last) return;
  const elapsed=(Date.now()-last)/86400000;
  if (elapsed>days) showToast(`⚠ Último backup há ${Math.floor(elapsed)} dias. Exporte!`,'warn',true);
}

    setLoadingMsg('Carregando corpus…');
    const corpus = await loadCorpus(repos.settings.get('corpus_url'));
    setLoadingMsg('Inicializando cartões…');
    await bootstrap(corpus, repos, repos.settings, n => {
      if (n > 0) setLoadingMsg(`Criando ${n} cartões pela primeira vez…`);
    });
    const engine = makeSrsEngine(repos.settings);
    document.querySelectorAll('.nav-btn').forEach(btn=>btn.addEventListener('click',()=>{
      const v=btn.dataset.view; showView(v);
      if (v==='dashboard') renderDashboard(repos,corpus,repos.settings,engine);
      if (v==='settings') renderSettings(repos,corpus,repos.settings,engine);
    }));
    await renderDashboard(repos, corpus, repos.settings, engine);
    checkBackupReminder(repos.settings);
  } catch(e) {
    console.error('Fatal:',e);
    document.getElementById('view-dashboard').innerHTML=`<div class="card">
      <div class="card-title" style="color:var(--danger)">Erro ao inicializar</div>
      <p>${e.message}</p>
      <p style="font-size:13px;color:var(--text-muted);margin-top:8px">Abra o console (F12) para detalhes.</p>
    </div>`;
  }
}

document.addEventListener('DOMContentLoaded', main);
  </script>
  <script>
    // PWA: registra o service worker (precisa de http(s); em file:// é ignorado).
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(e => console.warn('[pwa] SW não registrado:', e));
      });
    }
  </script>
</body>
